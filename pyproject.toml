[project]
name = "climate-capital"
version = "0.1.0"
description = "Climate-to-Capital Transmission Engine — RBI/NGFS-aligned, ERA5/IBTrACS physical risk, DuckDB+GeoParquet+PMTiles+MapLibre, ultra-light FOSS"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "you"}]
dependencies = [
  "polars>=1.20",
  "duckdb==1.5.5",
  "pyarrow>=16.0",
  "geopandas>=1.0",
  "shapely>=2.0",
  "xarray>=2024.10",
  "netcdf4",
  "rioxarray",
  "rio-cogeo",
  "rasterio",
  "leafmap[maplibre]>=0.40",
  "altair>=5.4",
  "statsmodels>=0.14",
  "scikit-learn>=1.5",
  "marimo>=0.13",
  "httpx>=0.27",
  "mercantile>=1.2",
  "mapbox-vector-tile>=2.2",
  "pmtiles>=3.0",
  "cdsapi>=0.7.7",
]

[project.optional-dependencies]
dev = ["ruff", "pytest"]

[dependency-groups]
dev = ["ruff", "pytest"]

[tool.ruff]
line-length = 100

[tool.marimo]
# reactive notebook config

[tool.hatch.build.targets.wheel]
packages = ["src/transition", "src/physical", "src/ccts"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
